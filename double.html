<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style3.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Creator Dashboard</title>
    <link rel="stylesheet" href="style for astral2.css">
</head>
<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>✨ Creator</h2>

            <button>➕ New</button>
            <button>🕒 History</button>
            <button>🌙 Dark Mode</button>
            <button>&#128161; Projects</button>
        
            <button> &#128219;Librabry</button>
        
            <button>&#128204;Goals </button>
            <button>More...</button>

            <div class="logout">
                <button>🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Section -->
        <main class="main">

            <!-- Navbar -->
            <div class="navbar">
                <input type="text" placeholder="🔍 Search content...">

                <div class="profile">
                    <!-- Replace with your image -->
                    <img src="images/myphoto.jpg" alt="Profile">

                    <div class="profile-info">
                        <h4>Yami</h4>
                        <p>Content Creator</p>
                    </div>
                </div>
            </div>

            <!-- Editor Card -->
            <div class="card">
                <h2>Create Content</h2>

                <textarea placeholder="Start writing your content here..."></textarea>

                <div class="upload-section">
                    <button>📷 Add Photo</button>
                    <button>📄 Add PDF</button>
                    <button>🎥 Add Video</button>
                </div>

                <div class="action-buttons">
                    <button>🔗 Share Link</button>
                    <button>📋 Copy</button>
                </div>
            </div>

        </main>

    </div>

</body>
</html>
