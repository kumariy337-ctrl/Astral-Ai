<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style for team.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA AI</title>
</head>
<body>
    <input type="text" placeholder="Search content...">
    <button>+ New Content</button>
    <div class="navbar">
        <h2>Content Creator</h2>
    
        <div class="profile">
            <img src="astra.jpg">
            <div class="profile-info">
                <h4>Yami</h4>
                <p>Content Creator</p>
            </div>
        </div>
    </div>
    <div class="profile">
        <span>🔔</span>
    
        <img src="content.jpg" alt="Profile">
    
        <div class="profile-info">
            <h4>Yami</h4>
            <p>Content Creator</p>
        </div>
    
        <span>▼</span>
    </div>
    <div class="sidebar">
        <h3>History</h3>
        <ul>
          <li>Blog Post</li>
          <li>Instagram Caption</li>
          <li>YouTube Script</li>
        </ul>
      </div>
      <textarea placeholder="Start writing..."></textarea>
      <input type="file" multiple>
      <button>Share</button>
<button>Copy</button>
<button id="darkMode">🌙</button>
<button>Logout</button>

    
</body>
</html>
